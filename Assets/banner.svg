<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
  <title id="title">Alcibiades Lopez's live system profile</title>
  <desc id="desc">Animated terminal profile with glowing code symbol and full-stack software developer stack.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#02050B" flood-opacity=".28"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feFlood flood-color="#F78CA0" flood-opacity=".45"/>
      <feComposite in2="b" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-lavender" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feFlood flood-color="#C9B1D9" flood-opacity=".4"/>
      <feComposite in2="b" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F78CA0" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#C9B1D9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#101B30" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9B1D9"/>
      <stop offset="100%" stop-color="#8291A8"/>
    </linearGradient>
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA8BA"/>
      <stop offset="100%" stop-color="#F78CA0"/>
    </linearGradient>
    <clipPath id="visualClip">
      <rect x="49" y="124" width="390" height="414" rx="3"/>
    </clipPath>
  </defs>

